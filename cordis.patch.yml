# dsh-enforce-package-manager: use the package manager the project already uses.
# To change settings, add a row like the one below to
# ~/.dsh/profiles/<profile>/cordis.patch.yml (one profile) or ~/.dsh/cordis.patch.yml
# (every profile). Keys you leave out keep their defaults.
#
# - id: enforce-package-manager
#   config:
#     mode: deny        # or ask
#     javascript: true
#     python: true
- insert:
    - id: enforce-package-manager
      name: dsh-enforce-package-manager
